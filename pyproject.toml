[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codesignal"
version = "0.1.0"
description = "Simulados progressivos CodeSignal em Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.1.1",
]

[project.scripts]
sim = "sim:main"

[tool.hatch.build.targets.wheel]
only-include = ["sim.py"]

[tool.pytest.ini_options]
addopts = "-x -v --tb=short --import-mode=importlib"
pythonpath = ["."]
testpaths = ["."]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 88
target-version = "py313"
